name: deploy JobMatch to Azure
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    #1. Hämta koden
    - uses: actions/checkout@v4

    #2. Installera .Net 8
    - name: Setup .Net
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    #3. Bygg appen
    - name: Build
      run: |
        dotnet publish JobMatch.API/JobMatch.API.csproj -f net8.0 -c Release -o ./publish
        grep -q '"tfm": "net8.0"' ./publish/JobMatch.API.runtimeconfig.json

    #4. Deploy till Azure
    - name: Deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: jobmatch-api-tf
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_TF }}
        package: ./publish




